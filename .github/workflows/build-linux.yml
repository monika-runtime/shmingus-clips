name: Build Linux client

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # `contents: write` lets a tag build create the GitHub release. Pull requests
  # from forks only ever get read access, and the release step runs on tags only.
  contents: write

jobs:
  build:
    name: Tauri bundle (x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libunwind-dev is a hard dependency of libgstreamer1.0-dev; naming it
          # explicitly lets apt resolve it against the runner image's libunwind8.
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file patchelf libfuse2 libunwind-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Build bundles
        env:
          # linuxdeploy is itself an AppImage; running it extracted avoids FUSE
          # problems on runners that lack /dev/fuse.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: shmingus-clips-linux-x86_64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Sign the AppImage for the updater
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="$(node -p "require('./package.json').version")"
          pnpm tauri signer sign \
            "src-tauri/target/release/bundle/appimage/Shmingus Clips_${version}_amd64.AppImage"

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p release
          cp "src-tauri/target/release/bundle/appimage/Shmingus Clips_${version}_amd64.AppImage" \
            "release/shmingus-clips_${version}_amd64.AppImage"
          cp "src-tauri/target/release/bundle/deb/Shmingus Clips_${version}_amd64.deb" \
            "release/shmingus-clips_${version}_amd64.deb"
          cp "src-tauri/target/release/bundle/appimage/Shmingus Clips_${version}_amd64.AppImage.sig" \
            "release/shmingus-clips_${version}_amd64.AppImage.sig"
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            const signature = fs
              .readFileSync(`release/shmingus-clips_${v}_amd64.AppImage.sig`, "utf8")
              .trim();
            const manifest = {
              version: v,
              notes: `Shmingus Clips ${v}`,
              pub_date: new Date().toISOString(),
              platforms: {
                "linux-x86_64": {
                  signature,
                  url: `https://github.com/monika-runtime/shmingus-clips/releases/download/v${v}/shmingus-clips_${v}_amd64.AppImage`,
                },
              },
            };
            fs.writeFileSync("release/latest.json", JSON.stringify(manifest, null, 2));
          ' "$version"
          cat release/latest.json

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Shmingus Clips ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*
